name: Sokiva marketplace quality gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Use Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Validate static application and security configuration
        run: node scripts/validate-static-site.mjs

      - name: Validate marketplace hardening regressions
        run: node scripts/validate-hardening-v2.mjs

      - name: Validate audit and traceability stack
        run: node scripts/validate-audit-stack.mjs

      - name: Validate live order tracking stack
        run: node scripts/validate-tracking-stack.mjs

      - name: Install backend test dependencies
        working-directory: functions
        run: npm install --ignore-scripts

      - name: Validate Cloud Functions syntax
        working-directory: functions
        run: npm run test:syntax

      - name: Test commerce, audit and tracking units
        working-directory: functions
        run: npm run test:unit

      - name: Install Firebase CLI
        run: npm install --ignore-scripts

      - name: Test Realtime Database rules in emulator
        run: npx firebase emulators:exec --project sokiva-rules-test --only database "npm --prefix functions run test:rules"
