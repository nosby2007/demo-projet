name: Marketplace quality gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Validate static application and security configuration
        run: npm run build

      - name: Install backend dependencies
        working-directory: functions
        run: npm install --ignore-scripts

      - name: Validate Cloud Functions syntax
        working-directory: functions
        run: npm test
