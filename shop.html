<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Catalogue SOKIVA — produits africains validés et livrés dans les UAE." />
  <meta name="theme-color" content="#FF6B2B" />
  <meta name="application-name" content="SOKIVA" />
  <link rel="manifest" href="app.webmanifest" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ff6b2b'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-family='Arial,sans-serif' font-size='30' font-weight='800' fill='white'%3ES%3C/text%3E%3C/svg%3E" />
  <title>Boutique — SOKIVA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-shell="full" data-page="shop.html">
  <main class="page">
    <section class="page-hero">
      <div class="container">
        <nav class="breadcrumb" aria-label="Fil d’Ariane"><a href="index.html">Accueil</a> › <span>Boutique</span></nav>
        <h1 class="page-title">Boutique SOKIVA</h1>
        <p class="page-subtitle">Seuls les produits réellement publiés et validés dans Firebase apparaissent ici.</p>
      </div>
    </section>
    <section class="shop-section">
      <div class="container">
        <div class="shop-toolbar">
          <div class="shop-chips" id="shop-chips"></div>
          <div class="shop-right">
            <span class="shop-count" id="shop-count"></span>
            <div class="sort-wrap">
              <select id="shop-sort" class="sort-select">
                <option value="default">Pertinence</option>
                <option value="price-asc">Prix : croissant</option>
                <option value="price-desc">Prix : décroissant</option>
                <option value="rating">Meilleures notes</option>
                <option value="new">Nouveautés</option>
              </select>
              <i data-lucide="chevrons-up-down"></i>
            </div>
          </div>
        </div>
        <div class="products-grid" id="shop-grid" role="list"></div>
      </div>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-functions-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="firebase-functions-config.js"></script>
  <script src="marketplace.js"></script>
  <script src="catalog-runtime.js"></script>
  <script src="app.js"></script>
</body>
</html>
