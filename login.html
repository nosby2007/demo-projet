<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Connexion à LAMYLENOISE." />
  <meta name="theme-color" content="#FF6B2B" />
  <meta name="application-name" content="LAMYLENOISE" />
  <link rel="manifest" href="app.webmanifest" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ff6b2b'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-family='Arial,sans-serif' font-size='30' font-weight='800' fill='white'%3EL%3C/text%3E%3C/svg%3E" />
  <title>Connexion — LAMYLENOISE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-shell="full" data-page="login.html">

  <main class="page auth-page">
    <section class="auth-section">
      <div class="container">
        <div class="auth-card">
          <a href="index.html" class="logo auth-logo">
            <span class="logo-nova">LAMYLENOISE</span><span class="logo-dot">●</span>
          </a>
          <h1>Bon retour parmi nous</h1>
          <p class="auth-sub">Connectez-vous pour accéder à vos commandes et favoris.</p>

          <form id="login-form" class="auth-form" novalidate>
            <label class="form-field full">
              <span>Email</span>
              <input type="email" required placeholder="vous@exemple.ae" />
            </label>
            <label class="form-field full">
              <span>Mot de passe</span>
              <input type="password" required placeholder="••••••••" />
            </label>
            <div class="auth-meta">
              <label class="checkbox-label"><input type="checkbox" /> Se souvenir de moi</label>
              <a href="#" class="auth-link">Mot de passe oublié ?</a>
            </div>
            <button type="submit" class="btn-primary auth-submit">
              <i data-lucide="log-in"></i> Se connecter
            </button>
          </form>

          <div class="auth-divider"><span>ou</span></div>

          <div class="auth-social">
            <button class="btn-social"><i data-lucide="chrome"></i> Continuer avec Google</button>
            <button class="btn-social"><i data-lucide="apple"></i> Continuer avec Apple</button>
          </div>

          <p class="auth-switch">
            Pas encore de compte ? <a href="register.html">Créer un compte</a>
          </p>
        </div>
      </div>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="marketplace.js"></script>
  <script src="app.js"></script>
</body>
</html>
