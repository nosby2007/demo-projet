<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Créer un compte client SOKIVA." />
  <meta name="theme-color" content="#FF6B2B" />
  <meta name="application-name" content="SOKIVA" />
  <link rel="manifest" href="app.webmanifest" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ff6b2b'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-family='Arial,sans-serif' font-size='30' font-weight='800' fill='white'%3ES%3C/text%3E%3C/svg%3E" />
  <title>Créer un compte — SOKIVA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-shell="full" data-page="register.html">
  <main class="page auth-page">
    <section class="auth-section">
      <div class="container">
        <div class="auth-card">
          <a href="index.html" class="logo auth-logo" aria-label="SOKIVA — Accueil">
            <span class="logo-nova">SOKIVA</span><span class="logo-dot">●</span>
          </a>
          <h1>Créer un compte client</h1>
          <p class="auth-sub">Un profil Firebase réel sera créé. Une vérification email est obligatoire avant la première connexion.</p>

          <form id="sokiva-register-form" class="auth-form" novalidate>
            <div class="form-row">
              <label class="form-field"><span>Prénom</span><input type="text" name="firstName" required autocomplete="given-name" placeholder="Prénom" /></label>
              <label class="form-field"><span>Nom</span><input type="text" name="lastName" required autocomplete="family-name" placeholder="Nom" /></label>
            </div>
            <label class="form-field full"><span>Email</span><input type="email" name="email" required autocomplete="email" placeholder="vous@exemple.com" /></label>
            <label class="form-field full"><span>Téléphone UAE</span><input type="tel" name="phone" required autocomplete="tel" placeholder="+971501234567" /></label>
            <div class="form-row">
              <label class="form-field"><span>Mot de passe</span><input type="password" name="password" required autocomplete="new-password" minlength="8" placeholder="Minimum 8 caractères" /></label>
              <label class="form-field"><span>Confirmer</span><input type="password" name="confirmPassword" required autocomplete="new-password" minlength="8" placeholder="Répéter le mot de passe" /></label>
            </div>

            <label class="checkbox-label small"><input type="checkbox" name="terms" required /> J’accepte les <a href="legal.html#terms" class="auth-link">conditions</a> et la <a href="legal.html#privacy" class="auth-link">politique de confidentialité</a>.</label>
            <label class="checkbox-label small"><input type="checkbox" name="marketingConsent" /> Recevoir les nouveautés SOKIVA par email.</label>

            <button type="submit" class="btn-primary auth-submit">
              <i data-lucide="user-plus"></i> Créer mon compte sécurisé
            </button>
          </form>

          <div class="auth-divider"><span>ou</span></div>
          <div class="auth-social">
            <button type="button" class="btn-social" data-google-login><i data-lucide="chrome"></i> Créer avec Google</button>
          </div>

          <p class="auth-switch">Déjà inscrit ? <a href="login.html">Se connecter</a></p>
          <p class="auth-switch small">Pour vendre ou livrer, créez d’abord un compte client puis envoyez une <a href="request.html">demande professionnelle</a>.</p>
        </div>
      </div>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-functions-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="firebase-functions-config.js"></script>
  <script src="marketplace.js"></script>
  <script src="app.js"></script>
  <script src="identity-runtime.js"></script>
</body>
</html>
